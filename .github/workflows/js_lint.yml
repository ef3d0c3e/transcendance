name: JS lints

on:
  push:

jobs:
  frontend-lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      # The root eslint.config.js resolves its plugins (Svelte included) from
      # ./node_modules: reuse the frontend's install, pinned by its lockfile
      - name: Install ESLint deps
        run: |
          npm ci --prefix frontend
          ln -s frontend/node_modules node_modules

      - name: Run ESLint
        run: npx eslint .
