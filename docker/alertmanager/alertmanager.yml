# Admins see the alerts in Grafana (Alerts dashboard) and here, where they can be silenced. They are also sent to
# the webhook and Discord channel of ALERT_WEBHOOK_URL and ALERT_DISCORD_WEBHOOK_URL when set, see start.sh, which
# adds them to the receiver below: it must stay the last entry of this file.
route:
  receiver: admins
  group_by: [alertname]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: admins
