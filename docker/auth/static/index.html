<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Admin sign-in · transcendance</title>
	<link rel="stylesheet" href="/auth/static/style.css">
	<script type="module" src="/auth/static/signin.js"></script>
</head>
<body>
	<main class="panel" id="signin" data-port="{{ .Port }}">
		<h1>Admin sign-in</h1>
		<p class="muted">The admin tools are reserved to holders of an authorized SSH key.</p>

		<section id="waiting" hidden>
			<p>Run this command in a terminal, then approve the request:</p>
			<div class="command">
				<code id="command"></code>
				<button type="button" id="copy">Copy</button>
			</div>
			<p class="muted" id="expiry"></p>
		</section>

		<section id="done" hidden>
			<p id="message"></p>
			<button type="button" id="retry">New code</button>
		</section>

		<p class="fingerprint muted">
			Server key: <code>{{ .Fingerprint }}</code>
		</p>
	</main>
</body>
</html>
