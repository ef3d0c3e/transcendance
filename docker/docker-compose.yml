name: transcendance-stack

# Container logs are rotated on disk
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  # Only published service, terminates TLS
  gateway:
    build: ./gateway
    image: transcendance-gateway
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:-transcendance.pundalik.org}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      TLS_EXTRA_SANS: ${TLS_EXTRA_SANS:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - certificates:/etc/nginx/certs
    depends_on:
      service:
        condition: service_healthy
      auth:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  # Admin sign-in over SSH, guards the tools behind the gateway
  auth:
    build:
      context: ..
      dockerfile: docker/auth/Dockerfile
    image: transcendance-auth
    restart: unless-stopped
    environment:
      AUTH_SSH_PUBLIC_PORT: ${AUTH_SSH_PORT:-2233}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-12h}
    ports:
      - "${AUTH_SSH_PORT:-2233}:2233"
    volumes:
      - auth_data:/data
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  service:
    build:
      context: ..
      dockerfile: docker/service/Dockerfile
    image: transcendance-service
    restart: unless-stopped
    environment:
      MYSQL_ADDRESS: mariadb:3306
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
    volumes:
      - card_images:/opt/transcendance/data/dist
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 256m
    logging: *logging

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MARIADB_USER: ${MYSQL_USER:?}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?}
      MARIADB_DATABASE: ${MYSQL_DATABASE:?}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - backend
    mem_limit: 384m
    logging: *logging

volumes:
  auth_data:
  certificates:
  db_data:
  card_images:

networks:
  backend:
