name: transcendance-stack

# Container logs are rotated on disk
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
    # Filebeat keeps the lines naming a compose service
    labels: com.docker.compose.service

services:
  # Only published service, terminates TLS
  gateway:
    build: ./gateway
    image: transcendance-gateway
    restart: unless-stopped
    environment:
      KIBANA_GATEWAY_PASSWORD: ${KIBANA_GATEWAY_PASSWORD:?}
      DOMAIN: ${DOMAIN:-transcendance.pundalik.org}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      TLS_EXTRA_SANS: ${TLS_EXTRA_SANS:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - certificates:/etc/nginx/certs
    # Upstreams are looked up per request, the gateway starts without them
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  # Admin sign-in over SSH, guards the tools behind the gateway
  auth:
    build:
      context: ..
      dockerfile: docker/auth/Dockerfile
    image: transcendance-auth
    restart: unless-stopped
    environment:
      AUTH_SSH_PUBLIC_PORT: ${AUTH_SSH_PORT:-2233}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-12h}
    ports:
      - "${AUTH_SSH_PORT:-2233}:2233"
    volumes:
      - auth_data:/data
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  service:
    build:
      context: ..
      dockerfile: docker/service/Dockerfile
    image: transcendance-service
    restart: unless-stopped
    environment:
      MYSQL_ADDRESS: mariadb:3306
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
    volumes:
      - card_images:/opt/transcendance/data/dist
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 256m
    logging: *logging

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MARIADB_USER: ${MYSQL_USER:?}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?}
      MARIADB_DATABASE: ${MYSQL_DATABASE:?}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - backend
    mem_limit: 384m
    logging: *logging

  # Logs
  elasticsearch:
    image: elasticsearch:9.5.5
    restart: unless-stopped
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      # Only reachable inside the stack
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      # Avoids needing vm.max_map_count on the host
      node.store.allow_mmap: "false"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health' | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - backend
    mem_limit: 1280m
    logging: *logging

  # Users, roles and policies, applied on every start
  elasticsearch-setup:
    image: elasticsearch:9.5.5
    restart: on-failure
    entrypoint: ["/setup.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?}
      KIBANA_GATEWAY_PASSWORD: ${KIBANA_GATEWAY_PASSWORD:?}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?}
    volumes:
      - ./elasticsearch/setup.sh:/setup.sh:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 128m
    logging: *logging

  kibana:
    image: kibana:9.5.5
    restart: unless-stopped
    environment:
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?}
      XPACK_SECURITY_SECURECOOKIES: "true"
      TELEMETRY_OPTIN: "false"
      NODE_OPTIONS: --max-old-space-size=768
    healthcheck:
      # 401 means up and asking for a login
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/kibana/api/status | grep -qE '^(200|401)$$'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 1g
    logging: *logging

  # Data view of the logs, applied on every start
  kibana-setup:
    image: elasticsearch:9.5.5
    restart: on-failure
    entrypoint: ["/kibana-setup.sh"]
    environment:
      KIBANA_GATEWAY_PASSWORD: ${KIBANA_GATEWAY_PASSWORD:?}
    volumes:
      - ./elasticsearch/kibana-setup.sh:/kibana-setup.sh:ro
    depends_on:
      kibana:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  logstash:
    image: logstash:9.5.5
    restart: unless-stopped
    environment:
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?}
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/ > /dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 640m
    logging: *logging

  # Reads the container logs of the host, keeps this stack's
  filebeat:
    image: elastic/filebeat:9.5.5
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${DOCKER_ROOT:-/var/lib/docker}/containers:/var/lib/docker/containers:ro
      - filebeat_data:/usr/share/filebeat/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5066/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      logstash:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 128m
    logging: *logging
volumes:
  es_data:
  filebeat_data:
  auth_data:
  certificates:
  db_data:
  card_images:

networks:
  backend:
