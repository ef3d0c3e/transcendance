name: transcendance-stack

# Container logs are rotated on disk
x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"
    # Filebeat keeps the lines naming a compose service
    labels: com.docker.compose.service

services:
  # Only published service, terminates TLS
  gateway:
    build: ./gateway
    image: transcendance-gateway
    restart: unless-stopped
    environment:
      KIBANA_GATEWAY_PASSWORD: ${KIBANA_GATEWAY_PASSWORD:?}
      DOMAIN: ${DOMAIN:-transcendance.pundalik.org}
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      TLS_EXTRA_SANS: ${TLS_EXTRA_SANS:-}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - certificates:/etc/nginx/certs
    # Upstreams are looked up per request, the gateway starts without them
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  # Admin sign-in over SSH, guards the tools behind the gateway
  auth:
    build:
      context: ..
      dockerfile: docker/auth/Dockerfile
    image: transcendance-auth
    restart: unless-stopped
    environment:
      AUTH_SSH_PUBLIC_PORT: ${AUTH_SSH_PORT:-2233}
      AUTH_SESSION_TTL: ${AUTH_SESSION_TTL:-12h}
    ports:
      - "${AUTH_SSH_PORT:-2233}:2233"
    volumes:
      - auth_data:/data
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  service:
    build:
      context: ..
      dockerfile: docker/service/Dockerfile
    image: transcendance-service
    restart: unless-stopped
    environment:
      MYSQL_ADDRESS: mariadb:3306
      METRICS_ADDR: :9101
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
    volumes:
      - card_images:/opt/transcendance/data/dist
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 256m
    logging: *logging

  mariadb:
    image: mariadb:11.8
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MARIADB_USER: ${MYSQL_USER:?}
      MARIADB_PASSWORD: ${MYSQL_PASSWORD:?}
      MARIADB_DATABASE: ${MYSQL_DATABASE:?}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - backend
    mem_limit: 384m
    logging: *logging

  # Logs
  elasticsearch:
    image: elasticsearch:9.5.5
    restart: unless-stopped
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      discovery.type: single-node
      # Only reachable inside the stack
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      xpack.ml.enabled: "false"
      ingest.geoip.downloader.enabled: "false"
      # Avoids needing vm.max_map_count on the host
      node.store.allow_mmap: "false"
    volumes:
      - es_data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health' | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    networks:
      - backend
    mem_limit: 1280m
    logging: *logging

  # Users, roles and policies, applied on every start
  elasticsearch-setup:
    image: elasticsearch:9.5.5
    restart: on-failure
    entrypoint: ["/setup.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?}
      KIBANA_SYSTEM_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?}
      KIBANA_GATEWAY_PASSWORD: ${KIBANA_GATEWAY_PASSWORD:?}
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?}
      ES_EXPORTER_PASSWORD: ${ES_EXPORTER_PASSWORD:?}
      GRAFANA_ES_PASSWORD: ${GRAFANA_ES_PASSWORD:?}
      LOG_RETENTION_DAYS: ${LOG_RETENTION_DAYS:-730}
      LOG_COMPRESS_AFTER_DAYS: ${LOG_COMPRESS_AFTER_DAYS:-14}
    volumes:
      - ./elasticsearch/setup.sh:/setup.sh:ro
    depends_on:
      elasticsearch:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 128m
    logging: *logging

  kibana:
    image: kibana:9.5.5
    restart: unless-stopped
    environment:
      SERVER_BASEPATH: /kibana
      SERVER_REWRITEBASEPATH: "true"
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
      ELASTICSEARCH_USERNAME: kibana_system
      ELASTICSEARCH_PASSWORD: ${KIBANA_SYSTEM_PASSWORD:?}
      XPACK_SECURITY_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?}
      XPACK_ENCRYPTEDSAVEDOBJECTS_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?}
      XPACK_REPORTING_ENCRYPTIONKEY: ${KIBANA_ENCRYPTION_KEY:?}
      XPACK_SECURITY_SECURECOOKIES: "true"
      TELEMETRY_OPTIN: "false"
      NODE_OPTIONS: --max-old-space-size=768
    healthcheck:
      # 401 means up and asking for a login
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://localhost:5601/kibana/api/status | grep -qE '^(200|401)$$'"]
      interval: 15s
      timeout: 5s
      start_period: 120s
      retries: 10
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 1g
    logging: *logging

  # Data view of the logs, applied on every start
  kibana-setup:
    image: elasticsearch:9.5.5
    restart: on-failure
    entrypoint: ["/kibana-setup.sh"]
    environment:
      KIBANA_GATEWAY_PASSWORD: ${KIBANA_GATEWAY_PASSWORD:?}
    volumes:
      - ./elasticsearch/kibana-setup.sh:/kibana-setup.sh:ro
    depends_on:
      kibana:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  logstash:
    image: logstash:9.5.5
    restart: unless-stopped
    environment:
      LOGSTASH_PASSWORD: ${LOGSTASH_PASSWORD:?}
      LS_JAVA_OPTS: -Xms256m -Xmx256m
    volumes:
      - ./logstash/logstash.yml:/usr/share/logstash/config/logstash.yml:ro
      - ./logstash/pipeline:/usr/share/logstash/pipeline:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9600/ > /dev/null"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 10
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 640m
    logging: *logging

  # Reads the container logs of the host, keeps this stack's
  filebeat:
    image: elastic/filebeat:9.5.5
    restart: unless-stopped
    user: root
    command: ["filebeat", "-e", "--strict.perms=false"]
    volumes:
      - ./filebeat/filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - ${DOCKER_ROOT:-/var/lib/docker}/containers:/var/lib/docker/containers:ro
      - filebeat_data:/usr/share/filebeat/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5066/ > /dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      logstash:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 128m
    logging: *logging

  # Monitoring
  prometheus:
    image: prom/prometheus:v3.15.1
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${METRICS_RETENTION:-30d}
      - --storage.tsdb.retention.size=2GB
      # Links in the alerts
      - --web.external-url=https://${DOMAIN:-transcendance.pundalik.org}:${HTTPS_PORT:-8443}/prometheus/
      - --web.route-prefix=/prometheus/
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9090/prometheus/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend
    mem_limit: 384m
    logging: *logging

  node-exporter:
    image: prom/node-exporter:v1.12.1
    restart: unless-stopped
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    restart: unless-stopped
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
      - --whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service
      - --disable_metrics=advtcp,cpu_topology,cpuset,hugetlb,memory_numa,percpu,process,referenced_memory,resctrl,sched,tcp,udp
    # Reads the cgroups and the Docker state of every container
    privileged: true
    volumes:
      - /:/rootfs:ro
      - ${DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock:ro
      - /sys:/sys:ro
      - ${DOCKER_ROOT:-/var/lib/docker}:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - backend
    mem_limit: 192m
    logging: *logging

  # Exporter's database user, applied on every start
  mariadb-setup:
    image: mariadb:11.8
    restart: on-failure
    entrypoint: ["/setup.sh"]
    environment:
      MARIADB_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:?}
    volumes:
      - ./mariadb/setup.sh:/setup.sh:ro
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  mysqld-exporter:
    image: prom/mysqld-exporter:v0.21.0
    restart: unless-stopped
    command:
      - --mysqld.address=mariadb:3306
      - --mysqld.username=exporter
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQLD_EXPORTER_PASSWORD:?}
    depends_on:
      mariadb-setup:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.5.3
    restart: unless-stopped
    command:
      - --nginx.scrape-uri=http://gateway:8081/stub_status
    networks:
      - backend
    mem_limit: 32m
    logging: *logging

  elasticsearch-exporter:
    image: prometheuscommunity/elasticsearch-exporter:v1.11.0
    restart: unless-stopped
    command:
      - --es.uri=http://elasticsearch:9200
    environment:
      ES_USERNAME: es_exporter
      ES_PASSWORD: ${ES_EXPORTER_PASSWORD:?}
    depends_on:
      elasticsearch-setup:
        condition: service_completed_successfully
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

  blackbox-exporter:
    image: prom/blackbox-exporter:v0.29.1
    restart: unless-stopped
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    volumes:
      - ./prometheus/blackbox.yml:/etc/blackbox/blackbox.yml:ro
    networks:
      - backend
    mem_limit: 32m
    logging: *logging

  grafana:
    image: grafana/grafana:13.2.5
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?}
      GF_SECURITY_COOKIE_SECURE: "true"
      # Admins are signed in by the gateway, which sets Remote-User
      GF_AUTH_PROXY_ENABLED: "true"
      GF_AUTH_PROXY_HEADER_NAME: Remote-User
      GF_AUTH_PROXY_HEADER_PROPERTY: username
      GF_AUTH_PROXY_AUTO_SIGN_UP: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_USERS_AUTO_ASSIGN_ORG_ROLE: Admin
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      # Plugins come with the image, nothing is downloaded
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      # Admins land on the firing alerts
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/transcendance-alerts.json
      GRAFANA_ES_PASSWORD: ${GRAFANA_ES_PASSWORD:?}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:3000/grafana/api/health"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5
    networks:
      - backend
    mem_limit: 320m
    logging: *logging

  # Groups and silences the alerts, admins see them in Grafana
  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      # Links in the alerts
      - --web.external-url=https://${DOMAIN:-transcendance.pundalik.org}:${HTTPS_PORT:-8443}/alertmanager/
      - --web.route-prefix=/alertmanager/
      # A single instance, no peers
      - --cluster.listen-address=
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9093/alertmanager/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend
    mem_limit: 64m
    logging: *logging

volumes:
  alertmanager_data:
  grafana_data:
  prometheus_data:
  es_data:
  filebeat_data:
  auth_data:
  certificates:
  db_data:
  card_images:

networks:
  backend:
