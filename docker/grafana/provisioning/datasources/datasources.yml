apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090/prometheus
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s

  - name: Logs
    uid: logs
    type: elasticsearch
    access: proxy
    url: http://elasticsearch:9200
    basicAuth: true
    basicAuthUser: grafana_reader
    editable: false
    jsonData:
      index: logs-transcendance-*
      timeField: "@timestamp"
      logMessageField: message
      logLevelField: log.level
    secureJsonData:
      basicAuthPassword: $GRAFANA_ES_PASSWORD

  - name: Alertmanager
    uid: alertmanager
    type: alertmanager
    access: proxy
    url: http://alertmanager:9093/alertmanager
    editable: false
    jsonData:
      implementation: prometheus
