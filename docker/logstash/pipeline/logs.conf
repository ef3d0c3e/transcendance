input {
  # Docker's gelf log driver, see x-logging in docker-compose.yml
  gelf {
    port => 12201
    use_tcp => false
  }
}

filter {
  # Keep the service name, drop the rest of Docker's metadata
  mutate {
    rename => { "[com.docker.compose.service]" => "[service][name]" }
    remove_field => ["command", "container_id", "image_id", "image_name", "created", "tag", "version", "host", "level", "facility", "source_host", "event"]
  }
  mutate {
    strip => ["message"]
  }

  if [service][name] == "service" {
    # Request log: [GIN] 2026/10/27 - 12:00:00 | 200 |  1.2ms |  172.18.0.5 | GET  "/shop"
    grok {
      match => {
        "message" => '^\[GIN\] %{DATA} \| +%{NUMBER:[http][response][status_code]:int} \| +%{DATA:[event][duration_text]} \| +%{DATA:[client][ip]} \| %{WORD:[http][request][method]} +"%{DATA:[url][original]}"'
      }
      add_tag => ["request"]
      tag_on_failure => []
    }
    if "request" not in [tags] {
      # Application log: 2026/10/27 12:00:00 WARN message
      grok {
        match => { "message" => "^%{DATA} %{TIME} %{LOGLEVEL:[log][level]} %{GREEDYDATA:message}" }
        overwrite => ["message"]
        tag_on_failure => []
      }
    }
  } else if [service][name] == "gateway" {
    grok {
      match => { "message" => '^%{HTTPD_COMBINEDLOG}(?: "%{DATA:[http][request][forwarded_for]}")?$' }
      remove_field => ["timestamp"]
      add_tag => ["request"]
      tag_on_failure => []
    }
  }

  # Health checks run every few seconds, they would drown the rest
  if [url][original] == "/healthz" or [url][original] == "/auth/healthz" {
    drop {}
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    user => "logstash_internal"
    password => "${LOGSTASH_PASSWORD}"
    data_stream => "true"
    data_stream_type => "logs"
    data_stream_dataset => "transcendance"
    data_stream_namespace => "default"
  }
}
