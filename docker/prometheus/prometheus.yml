global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    metrics_path: /prometheus/metrics
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: app
    static_configs:
      - targets: ["service:9101"]

  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: containers
    scrape_interval: 30s
    static_configs:
      - targets: ["cadvisor:8080"]

  - job_name: mariadb
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  - job_name: elasticsearch
    scrape_interval: 30s
    static_configs:
      - targets: ["elasticsearch-exporter:9114"]

  # Probes from inside the stack, as a visitor would see it
  - job_name: probe-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - https://gateway/cards/search/
          - http://service:8080/healthz
    relabel_configs: &probe_relabel
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox-exporter:9115

  - job_name: probe-ssh
    metrics_path: /probe
    params:
      module: [ssh_banner]
    static_configs:
      - targets: ["auth:2233"]
    relabel_configs: *probe_relabel
