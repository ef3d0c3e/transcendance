# promtool test rules alerts_test.yml
rule_files:
  - alerts.yml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      - series: 'up{job="app", instance="service:9101"}'
        values: "1 0 0 0"
      - series: 'http_requests_total{status="200"}'
        values: "0+90x10"
      - series: 'http_requests_total{status="500"}'
        values: "0+10x10"
      - series: 'node_filesystem_avail_bytes{fstype="ext4", mountpoint="/"}'
        values: "10x15"
      - series: 'node_filesystem_size_bytes{fstype="ext4", mountpoint="/"}'
        values: "100x15"
    alert_rule_test:
      - eval_time: 2m
        alertname: TargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: TargetDown
        exp_alerts:
          - exp_labels: {severity: critical, job: app, instance: "service:9101"}
            exp_annotations:
              summary: "app is unreachable"
              description: "Prometheus cannot scrape service:9101 (app) for 2 minutes."
      - eval_time: 10m
        alertname: HighErrorRate
        exp_alerts:
          - exp_labels: {severity: critical}
            exp_annotations:
              summary: "The site answers with server errors"
              description: "10% of requests fail with a 5xx status."
      - eval_time: 15m
        alertname: DiskAlmostFull
        exp_alerts:
          - exp_labels: {severity: warning, fstype: ext4, mountpoint: /}
            exp_annotations:
              summary: "Disk / is almost full"
              description: "90% of / is used."
