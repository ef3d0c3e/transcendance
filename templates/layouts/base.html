{{ define "base" }}
<!DOCTYPE html>
<html theme="{{ .Theme }}">

<head>
	<script src="https://cdn.jsdelivr.net/npm/e-layout/dist/e-layout.min.js"></script>

	<script>
		if (!document.cookie.includes('theme=')) {
			const theme = matchMedia('(prefers-color-scheme: dark)').matches
				? 'dark'
				: 'light';
			document.cookie = `theme=${theme}; Path=/; Max-Age=31536000; SameSite=Lax`;
			document.documentElement.setAttribute("theme", theme);
		}
	</script>
	<link rel="stylesheet" href="/static/theme.css" type="text/css">

	<title>{{ .Data.Title }}</title>

	<script type="module" src="/frontend/main.js"></script>
</head>

<body>
	<header>
		<h1 class="header-title">Transcendance</h1>

		<input type="checkbox" id="nav-toggle" class="nav-toggle" aria-label={{ .T "navbar-label-toggle" }} />
		<label for="nav-toggle" class="nav-toggle-btn" aria-hidden="true">
			<svg width="24" height="24" viewBox="0 0 24 24">
				<path d="M4 6h16M4 12h16M4 18h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"
					fill="none" />
			</svg>
		</label>

		<nav id="header-nav">
			<label for="nav-toggle" class="nav-close" aria-hidden="true">
				<svg width="24" height="24" viewBox="0 0 24 24">
					<path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"
						fill="none" />
				</svg>
			</label>

			<div id="language-switcher" data-label="{{ .T "language-switcher" }}"></div>

			<span id="theme-switcher" data-theme-label-light="{{ .T "theme-switcher-light" }}"
				data-theme-label-dark="{{ .T "theme-switcher-dark" }}"></span>
			<a href="/shop">{{ .T "navbar-shop" }}</a>
			<span id="login-popup" data-label="{{ .T "login-title" }}"></span>
			<span id="register-popup" data-label="{{ .T "register-title" }}"></span>
		</nav>
	</header>
	<main>
		{{ .Children.Content }}
	</main>
	<!-- Card rendering styles and interactions, mounted once for every card on the page -->
	<div id="card-rendering"></div>
</body>

</html>
{{ end }}
