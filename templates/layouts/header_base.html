{{ define "header_base" }}
<header>
	<e-cluster justify="space-evenly" align="center">
		<e-box>
			<h1>
				{{ .T "index-title" }}
			</h1>
		</e-box>
		<e-box>
			<h2>
				{{ if .Data.User }}
				<a href="profile">{{ .Data.User.Username }}</a>
				{{ else }}
				{{ .T "guest-name"}}
				{{ end }}
			</h2>
		</e-box>
	</e-cluster>
</header>
{{ end }}
