{{ define "card-search" }}
<e-center intrisic>
	<form
			id="search-form"
			action="/cards/search"
			method="get">
		<input
			type="text"
			id="query"
			name="query"
			placeholder="{{ .T "card-search-placeholder" }}"
			value="{{ .Data.Query }}">
		<button type="submit">{{ .T "card-search-submit" }}</button>
	</form>
</e-center>

<e-cluster justify="center">
	{{ range $val := .Data.Cards }}
		{{ template "card" $val }}
	{{ end }}
<e-cluster>
{{ end }}
