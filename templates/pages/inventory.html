{{ define "inventory" }}
<h2>{{ .Data.Title }}</h2>
{{ if ne .Data.Message nil }}
<p>{{ .Data.Message }}</p>
{{ end }}
{{ if ne (len .Data.Cards) 0 }}
	{{ .Children.Paginator }}
    <e-cluster justify="center">
        {{ range $val := .Data.Cards }}
        {{ template "card" $val }}
        {{ end }}
    </e-cluster>
{{end}}
{{ end }}
