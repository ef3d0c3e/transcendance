{{ define "login" }}
<script type="module" src="/frontend/login.js"></script>
<h1>{{ .T "login-title" }}</h1>
{{ if .Data.User }}
<h3>{{ .T "login-error-authenticated" }}</h3>
{{ else }}
<form
	id="login-form"
	action="/login"
	method="post">
	<div id="form-result"></div>
	<label for="username">{{ .T "login-username" }}</label>
	<input
		type="text"
		id="username"
		name="username"
		autocomplete="username"
		required>
	<label for="password">{{ .T "login-password" }}</label>
	<input
		type="password"
		id="password"
		name="password"
		autocomplete="current-password"
		required>

	<button type="submit">{{ .T "login-submit" }}</button>
</form>
<div id="login-enhancement"></div>
{{ end }}
{{ end }}
