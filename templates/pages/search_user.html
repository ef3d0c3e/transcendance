{{ define "search_user" }}
<style>
.profile-picture {
	height: 2em;
	width: 2em;
	margin: 0;
	padding: 0;
	vertical-align: -.7em;
}
</style>
<e-center intrinsic>
<form
	class="search-form"
	id="search-form"
	action="/search"
	method="get">
	<input
		type="text"
		id="username"
		name="username"
		placeholder="{{ .T "search-user-form-placeholder" }}"
		value="{{ .Data.Username }}">

	<button type="submit" aria-role="{{ .T "search-user-submit" }}"></button>
</form>
</e-center>
<ul>
{{ range $val := .Data.Users }}
	<li>
		<img src="/avatars/{{ $val.ID }}" class="profile-picture" alt="Avatar">
		<a href="/profile/{{$val.Username}}">{{$val.Username}}</a>
	</li>
{{ end }}
</ul>
{{ .Children.Paginator }}
{{ end }}
