{{ define "booster-pile" }}

<div class="card-container">
	<article class="card booster-pile-art{{ if .PileEmpty }} booster-pile-empty{{ end }}"
		style="--c1: {{ .ColorPrimary }}; --c2: {{ .ColorSecondary }};">
		<div class="booster-pile-packs" aria-hidden="true">
			<svg viewBox="0 0 120 100">
				<rect x="12" y="28" width="50" height="64" rx="5" opacity="0.5" transform="rotate(-12 37 60)" />
				<rect x="32" y="18" width="50" height="64" rx="5" opacity="0.7" transform="rotate(-2 57 50)" />
				<rect x="52" y="12" width="50" height="64" rx="5" opacity="0.9" transform="rotate(8 77 44)" />
			</svg>
		</div>
		<h2 class="card-title">{{ .PileTitle }}</h2>
		<p class="card-description">{{ .PileDescription }}</p>

		<div class="card-effect card-glare" data-z="10" data-opacity="0.5" aria-hidden="true"></div>
	</article>
	<span class="booster-pile-count">{{ .PileCountLabel }}</span>
	{{ with .PileTimerLabel }}
	<span class="booster-pile-timer" data-countdown="{{ $.PileTimerSeconds }}">{{ . }}</span>
	{{ end }}
</div>
{{ end }}
