{{ define "card" }}
<div class="card-container" {{ .Data.CardContainerData }}{{ if .Data.CardAcquired }}
	data-acquired="{{ .Data.CardAcquired }}" data-collection-url="/collections/{{ .Data.CardCollectionID }}"
	data-collection-title="{{ .Data.CardCollectionTitle }}" data-card-title="{{ .Data.CardTitle }}"{{ end }}>
	<article class="card"
		style="--c1: {{ .Data.CardColorPrimary }}; --c2: {{ .Data.CardColorSecondary }}; --badge-color: {{ .Data.CardBadgeColor }}">
		<img class="card-image" src="{{ .Data.CardArtwork }}" draggable="false">
		<span class="card-badge">{{ .Data.CardBadge }}</span>
		<h2 class="card-title">{{ .Data.CardTitle }}</h2>
		<p class="card-description">{{ .Data.CardDescription }}</p>
		<div class="card-footer">
			<a class="card-collection" href="/collections/{{ .Data.CardCollectionID }}">{{ .Data.CardCollectionTitle
				}}</a>
			<span class="card-number">{{ .Data.CardCount }}</span>
		</div>

		<div class="card-effect card-glare" data-z=11 data-opacity="0.5"></div>
		{{ range .Data.CardEffects }}
		<div class="card-effect {{ .Class }}" {{ .Attrs }}></div>
		{{ end }}
	</article>
</div>
{{ end }}
