{{ define "card" }}
<div class="card-container{{ if .Data.CardMissing }} is-missing{{ end }}" {{ .Data.CardContainerData }} {{ with .Data.CardAcquiredFirst }}data-copies="{{ $.Data.CardCopies }}"
	data-acquired-first="{{ . }}" data-acquired-last="{{ $.Data.CardAcquiredLast }}"{{ end }}>
	<article class="card"
		style="--c1: {{ .Data.CardColorPrimary }}; --c2: {{ .Data.CardColorSecondary }}; --badge-color: {{ .Data.CardBadgeColor }}">
		<img class="card-image" src="{{ .Data.CardArtwork }}" alt="" draggable="false" decoding="async"
			{{ if not .Data.CardEager }}loading="lazy"{{ end }}>
		<span class="card-badge">{{ .Data.CardBadge }}</span>
		<h2 class="card-title">{{ .Data.CardTitle }}</h2>
		<p class="card-description">{{ .Data.CardDescription }}</p>
		<div class="card-footer">
			<a class="card-collection" href="/collections/{{ .Data.CardCollectionID }}">{{ .Data.CardCollectionTitle
				}}</a>
			<span class="card-number">{{ .Data.CardCount }}</span>
		</div>

		<div class="card-effect card-glare" data-z="11" data-opacity="0.5"></div>
		{{ with .Data.CardFoilMask }}
		<div class="card-effect card-foil" data-z="12" data-opacity="{{ $.Data.CardFoilOpacity }}"
			data-scale="{{ $.Data.CardFoilScale }}" data-color="{{ $.Data.CardFoilColor }}" data-mask="{{ . }}"></div>
		{{ end }}
	</article>
	{{ with .Data.CardCopies }}{{ if gt . 1 }}
	<span class="card-stack">×{{ . }}</span>
	{{ end }}{{ end }}
</div>
{{ end }}
