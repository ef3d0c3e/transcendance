{{ define "language-switcher" }}
<style>
:root[theme="light"] {
    --color-language-switcher: #e7eeeb;
}

.language-switcher {
    padding: .5rem;
    background: var(--color-language-switcher);
    color: var(--color-text);

    &:hover {
        background: color-mix(in srgb, var(--color-language-switcher), black 10%);
    }

    &:active {
        background: color-mix(in srgb, var(--color-language-switcher), black 20%);
    }
}
</style>
<button type="button" class="language-switcher">
    🇫🇷 FR
</button>
{{ end }}
