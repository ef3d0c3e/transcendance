{{/* Coin top-up popup, opened by the page. Needs .Data.Topups. */}}
{{ define "topup-popup" }}
<style>
	.shop-topup-popup {
		width: min(100% - 2rem, 34rem);
		max-height: calc(100% - 2rem);
		padding: 0;

		overflow: auto;

		color: var(--color-text);
		background: var(--color-bg-2);
		border: 1px solid var(--color-border-1);
		border-radius: 1rem;
		box-shadow: 0 10px 30px var(--color-shadow);
	}

	.shop-topup-popup::backdrop {
		background: rgb(0 0 0 / 55%);
		backdrop-filter: blur(3px);
	}

	.shop-topup-popup[open] {
		animation: shop-topup-popup-in 150ms ease;
	}

	.shop-topup-content {
		display: flex;
		flex-direction: column;
		gap: 1rem;

		padding: 1.25rem 1.25rem 1rem;
	}

	.shop-topup-content h2 {
		margin: 0;

		font-size: 1.25rem;
	}

	.shop-note {
		margin: 0;

		color: var(--color-text-muted);
		font-size: .9em;
	}

	.shop-topup-packs {
		display: grid;
		grid-template-columns: repeat(auto-fit, minmax(9.5rem, 1fr));
		gap: .75rem;

		margin: 0;
		padding: 0;

		list-style: none;
	}

	.shop-topup-pack {
		display: flex;
		flex-direction: column;
		align-items: center;
		gap: .75rem;

		height: 100%;
		padding: 1rem .75rem .75rem;

		background: var(--color-bg-4);
		border: 1px solid var(--color-border-1);
		border-radius: .75rem;
	}

	.shop-topup-amount {
		display: inline-flex;
		align-items: center;
		gap: .35em;

		font-size: 1.1rem;
		font-weight: 650;
		font-variant-numeric: tabular-nums;
		white-space: nowrap;
	}

	.shop-topup-amount .coin-icon {
		width: 1.3em;
		height: 1.3em;
	}

	/* Not enough to cover what the page needs */
	.shop-topup-pack.is-short {
		opacity: .5;
	}

	.shop-topup-pack button {
		width: 100%;
		margin-top: auto;

		font-variant-numeric: tabular-nums;
	}

	.shop-topup-actions {
		display: flex;
		justify-content: flex-end;
	}

	/* Closing is the neutral action, like the unselected inventory tabs */
	.shop-topup-actions button {
		color: var(--color-text);
		background: var(--color-bg-4);
	}

	.shop-topup-actions button:hover {
		background: color-mix(in srgb, var(--color-bg-4), black 10%);
	}

	@keyframes shop-topup-popup-in {
		from {
			opacity: 0;
			transform: translateY(.5rem) scale(.98);
		}
	}

	/* Small screens: bottom sheet, like the other popups */
	@media (max-width: 480px) {
		.shop-topup-popup {
			width: 100%;
			max-width: 100%;
			margin: auto 0 0;

			border-radius: 1rem 1rem 0 0;
			border-bottom: 0;
		}

		.shop-topup-content {
			padding-bottom: max(1rem, env(safe-area-inset-bottom));
		}
	}
</style>
<dialog id="shop-topup-popup" class="shop-topup-popup" aria-labelledby="shop-topup-popup-title">
	<div class="shop-topup-content">
		<h2 id="shop-topup-popup-title">{{ .T "shop-topup-title" }}</h2>
		<p class="shop-note">{{ .T "shop-topup-note" }}</p>
		<p class="section-error" data-shop-topup-error role="alert" hidden>{{ .T "shop-topup-error-unconfirmed" }}</p>
		<ul class="shop-topup-packs">
		{{ range .Data.Topups }}
			<li>
				<form class="shop-topup-pack" action="/shop/topup" method="post" data-amount="{{ .Amount }}">
					<input type="hidden" name="pack" value="{{ .ID }}">
					<span class="shop-topup-amount">{{ template "coin-icon" }} {{ .Label }}</span>
					<button type="submit">{{ .Price }}</button>
				</form>
			</li>
		{{ end }}
		</ul>
		<div class="shop-topup-actions">
			<button type="button" data-shop-topup-close>{{ .T "shop-buy-close" }}</button>
		</div>
	</div>
</dialog>
{{ end }}
